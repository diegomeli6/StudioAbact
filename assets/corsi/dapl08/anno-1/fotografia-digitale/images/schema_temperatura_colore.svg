<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <linearGradient id="gradKelvin2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="900" height="460" rx="16" fill="url(#bgGrad4)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <rect x="0" y="-6" width="6" height="40" rx="3" fill="#feb940"/>
    <text x="18" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">LA TEMPERATURA COLORE E LA SCALA KELVIN</text>
    <text x="18" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Radiazione termica dello spettro visibile, bilanciamento del bianco (WB) e dominanti cromatiche</text>
  </g>

  <!-- Spettro Kelvin Gradiente Bar -->
  <rect x="50" y="115" width="800" height="50" rx="10" fill="url(#gradKelvin2)" stroke="#475569" stroke-width="1.5"/>

  <!-- Tacche e valori ben distribuiti -->
  <!-- 2000K -->
  <g transform="translate(100, 165)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#f97316" stroke-width="2" stroke-dasharray="4"/>
    <rect x="-65" y="45" width="130" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="0" y="65" text-anchor="middle" fill="#f97316" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1800K - 2500K</text>
    <text x="0" y="82" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">Candela / Alba</text>
    <text x="0" y="96" text-anchor="middle" fill="#fb923c" font-family="system-ui, sans-serif" font-size="10.5">Luce Calda / Ambra</text>
  </g>

  <!-- 3200K -->
  <g transform="translate(270, 165)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#facc15" stroke-width="2" stroke-dasharray="4"/>
    <rect x="-65" y="45" width="130" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="0" y="65" text-anchor="middle" fill="#facc15" font-family="system-ui, sans-serif" font-size="13" font-weight="800">3200K</text>
    <text x="0" y="82" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">Tungsteno / Alogena</text>
    <text x="0" y="96" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="10.5">Studio teatrale</text>
  </g>

  <!-- 5500K -->
  <g transform="translate(450, 165)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4"/>
    <rect x="-70" y="45" width="140" height="60" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="0" y="65" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="800">5500K - 5600K</text>
    <text x="0" y="82" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5">Luce Solare / Flash</text>
    <text x="0" y="96" text-anchor="middle" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10.5">Bianco Neutro Standard</text>
  </g>

  <!-- 6500K -->
  <g transform="translate(630, 165)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4"/>
    <rect x="-65" y="45" width="130" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="0" y="65" text-anchor="middle" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="800">6500K - 7000K</text>
    <text x="0" y="82" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">Cielo Nuvoloso</text>
    <text x="0" y="96" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10.5">Luce Fredda Diffusa</text>
  </g>

  <!-- 10000K -->
  <g transform="translate(800, 165)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4"/>
    <rect x="-65" y="45" width="130" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="0" y="65" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="13" font-weight="800">9000K - 12000K</text>
    <text x="0" y="82" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">Ombra in Montagna</text>
    <text x="0" y="96" text-anchor="middle" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10.5">Forte Dominante Blu</text>
  </g>

  <!-- Box White Balance Didattico -->
  <g transform="translate(50, 340)">
    <rect width="800" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="85" rx="3" fill="#feb940"/>
    <text x="20" y="26" fill="#feb940" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">IL BILANCIAMENTO DEL BIANCO (WHITE BALANCE - WB)</text>
    <text x="20" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Impostare il WB (in Kelvin o preset Sole, Ombra, Incandescente) istruisce il sensore su quale radiazione interpretare come bianco neutro.</text>
    <text x="20" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Scattando in formato RAW, la temperatura colore non viene bruciata nel pixel: puo essere ricalibrata senza perdita qualitativa in camera chiara.</text>
  </g>
</svg>