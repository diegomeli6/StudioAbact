<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660">
  <defs>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="900" height="660" rx="16" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(50, 40)">
    <rect x="0" y="-6" width="6" height="40" rx="3" fill="#feb940"/>
    <text x="18" y="16" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">IL TRIANGOLO DELL'ESPOSIZIONE</text>
    <text x="18" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Interdipendenza tra Diaframma (Apertura), Tempo di Scatto (Otturatore) e Sensibilità ISO</text>
  </g>

  <!-- Triangolo Centrale Equilatero -->
  <polygon points="450,150 170,510 730,510" fill="url(#triGrad)" stroke="#feb940" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Centro: Esposizione Corretta 0 EV -->
  <circle cx="450" cy="390" r="54" fill="#0f172a" stroke="#feb940" stroke-width="2"/>
  <text x="450" y="385" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">ESPOSIZIONE</text>
  <text x="450" y="405" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">0 EV (Equilibrio)</text>

  <!-- VERTICE SUPERIORE: DIAFRAMMA (Apertura) -->
  <circle cx="450" cy="150" r="32" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="450" y="155" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">f/stop</text>
  
  <!-- Titolo sopra il cerchio -->
  <text x="450" y="100" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">DIAFRAMMA (APERTURA)</text>
  <text x="450" y="202" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Controlla la Quantità di Luce e la Profondità di Campo</text>
  
  <!-- Valori estremi ai lati -->
  <g transform="translate(190, 140)">
    <rect width="180" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="22" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">f/1.4 - f/2.8: Bokeh / Sfocato</text>
  </g>
  <g transform="translate(530, 140)">
    <rect width="180" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="22" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">f/11 - f/16: Tutto a fuoco</text>
  </g>

  <!-- VERTICE SINISTRO INFERIORE: TEMPO DI SCATTO -->
  <circle cx="170" cy="510" r="32" fill="#d97706" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="170" y="515" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">SEC</text>
  
  <text x="170" y="565" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="800">TEMPO DI SCATTO</text>
  <text x="170" y="586" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Controlla la Durata e il Movimento</text>
  <text x="170" y="608" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">1/2000s (Congelato) &lt;--&gt; 2s (Mosso creativo)</text>

  <!-- VERTICE DESTRO INFERIORE: SENSIBILITÀ ISO -->
  <circle cx="730" cy="510" r="32" fill="#059669" stroke="#34d399" stroke-width="2.5"/>
  <text x="730" y="515" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">ISO</text>
  
  <text x="730" y="565" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">SENSIBILITÀ ISO</text>
  <text x="730" y="586" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">Amplificazione Elettronica del Segnale</text>
  <text x="730" y="608" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">ISO 100 (Nitido/Pulito) &lt;--&gt; ISO 6400 (Rumore/Grana)</text>

  <!-- Freccia circolare di reciprocità -->
  <path d="M 330 250 A 240 240 0 0 1 570 250" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="450" y="240" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LEGGE DI RECIPROCITÀ (H = E × t)</text>
</svg>