<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" style="background:#12151c;border-radius:12px;">
  <rect width="800" height="240" rx="12" fill="#12151c"/>
  
  <!-- 1. Tetraedro (Fuoco) -->
  <g transform="translate(80, 40)">
    <polygon points="0,-35 -30,25 30,25" fill="none" stroke="#ef4444" stroke-width="2"/>
    <line x1="0" y1="-35" x2="0" y2="10" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="-30" y1="25" x2="0" y2="10" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="30" y1="25" x2="0" y2="10" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="65" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TETRAEDRO</text>
    <text x="0" y="82" text-anchor="middle" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="600">4 Facce | Fuoco</text>
  </g>

  <!-- 2. Cubo (Terra) -->
  <g transform="translate(230, 40)">
    <rect x="-25" y="-20" width="45" height="45" fill="none" stroke="#eab308" stroke-width="2"/>
    <rect x="-15" y="-30" width="45" height="45" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="-25" y1="-20" x2="-15" y2="-30" stroke="#eab308" stroke-width="1.5"/>
    <line x1="20" y1="-20" x2="30" y2="-30" stroke="#eab308" stroke-width="1.5"/>
    <line x1="-25" y1="25" x2="-15" y2="15" stroke="#eab308" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="20" y1="25" x2="30" y2="15" stroke="#eab308" stroke-width="1.5"/>
    <text x="2" y="65" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CUBO (ESAEDRO)</text>
    <text x="2" y="82" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="11" font-weight="600">6 Facce | Terra</text>
  </g>

  <!-- 3. Ottaedro (Aria) -->
  <g transform="translate(400, 40)">
    <polygon points="0,-35 28,0 0,35 -28,0" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="0" y="65" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OTTAEDRO</text>
    <text x="0" y="82" text-anchor="middle" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="11" font-weight="600">8 Facce | Aria</text>
  </g>

  <!-- 4. Icosaedro (Acqua) -->
  <g transform="translate(570, 40)">
    <polygon points="0,-35 30,-15 30,20 0,35 -30,20 -30,-15" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="0,-35 0,35" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
    <polygon points="-30,-15 30,20" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
    <polygon points="30,-15 -30,20" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="0" y="65" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ICOSAEDRO</text>
    <text x="0" y="82" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">20 Facce | Acqua</text>
  </g>

  <!-- 5. Dodecaedro (Etere / Cosmo) -->
  <g transform="translate(720, 40)">
    <!-- Pentagonal projection -->
    <polygon points="0,-35 32,-11 20,28 -20,28 -32,-11" fill="none" stroke="#a855f7" stroke-width="2"/>
    <polygon points="0,-18 17,-5 10,14 -10,14 -17,-5" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="0" y1="-35" x2="0" y2="-18" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="32" y1="-11" x2="17" y2="-5" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="20" y1="28" x2="10" y2="14" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="-20" y1="28" x2="-10" y2="14" stroke="#a855f7" stroke-width="1.5"/>
    <line x1="-32" y1="-11" x2="-17" y2="-5" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="65" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DODECAEDRO</text>
    <text x="0" y="82" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">12 Facce | Etere / Cosmo</text>
  </g>

  <text x="400" y="195" text-anchor="middle" fill="#feb940" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1">I CINQUE SOLIDI PLATONICI E LA STRUTTURA DELLA MATERIA</text>
  <text x="400" y="215" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Dal dialogo del Timeo di Platone: forme geometriche regolari inscrivibili nella sfera universale</text>
</svg>